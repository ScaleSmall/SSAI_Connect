name: Validate Connect app

run-name: >-
  Validate Connect app${{
    github.event_name == 'workflow_dispatch'
    && format(' [{0}]', inputs.release_proof_id)
    || ''
  }}

on:
  workflow_dispatch:
    inputs:
      release_proof_id:
        description: Immutable correlation generated by the Shared dependency review workflow
        required: true
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Bind explicit release dispatch to the repository Actions bot
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_PROOF_ID: ${{ inputs.release_proof_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DISPATCH_ACTOR}" != 'github-actions[bot]' ]; then
            echo "::error::Explicit release dispatch actor must be github-actions[bot], got ${DISPATCH_ACTOR}"
            exit 1
          fi
          if [ "${DISPATCH_TRIGGERING_ACTOR}" != 'github-actions[bot]' ]; then
            echo "::error::Explicit release dispatch triggering actor must be github-actions[bot], got ${DISPATCH_TRIGGERING_ACTOR}"
            exit 1
          fi
          [[ "${RELEASE_PROOF_ID}" =~ ^shared-[0-9a-f]{40}-[0-9a-f]{40}$ ]]

      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Create nonsecret validation-only browser configuration
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_BUILD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          project_ref='connectvalidation'
          header="$(printf '%s' '{"alg":"none","typ":"JWT"}' | base64 --wrap=0 | tr '+/' '-_' | tr -d '=')"
          payload="$(jq -nc --arg ref "${project_ref}" \
            '{iss:"supabase",ref:$ref,role:"anon",iat:0,exp:4102444800}' \
            | base64 --wrap=0 | tr '+/' '-_' | tr -d '=')"
          {
            printf 'VITE_SUPABASE_URL=https://%s.supabase.co\n' "${project_ref}"
            printf 'VITE_SUPABASE_ANON_KEY=%s.%s.connect-validation-signature\n' "${header}" "${payload}"
            printf 'VITE_SSAI_BUILD_SHA=%s\n' "${EXPECTED_BUILD_SHA}"
          } >>"${GITHUB_ENV}"

      - name: Install public dependencies without credentials or lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .npmrc || { echo '::error::Repository .npmrc is forbidden'; exit 1; }
          public_git_config="$(mktemp "${RUNNER_TEMP}/ssai-connect-public-gitconfig.XXXXXX")"
          npm_user_config="$(mktemp "${RUNNER_TEMP}/ssai-connect-npm-userconfig.XXXXXX")"
          npm_global_config="$(mktemp "${RUNNER_TEMP}/ssai-connect-npm-globalconfig.XXXXXX")"
          cleanup_configs() { rm -f -- "${public_git_config}" "${npm_user_config}" "${npm_global_config}"; }
          trap cleanup_configs EXIT
          git config --file "${public_git_config}" credential.helper ''
          git config --file "${public_git_config}" core.hooksPath /dev/null
          git config --file "${public_git_config}" protocol.file.allow never
          git config --file "${public_git_config}" protocol.ext.allow never
          for source in 'git+https://github.com/' 'ssh://git@github.com/' 'git+ssh://git@github.com/' 'git@github.com:'; do
            git config --file "${public_git_config}" --add url."https://github.com/".insteadOf "${source}"
          done
          export GIT_CONFIG_GLOBAL="${public_git_config}" GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/false SSH_ASKPASS=/bin/false
          export NPM_CONFIG_USERCONFIG="${npm_user_config}" NPM_CONFIG_GLOBALCONFIG="${npm_global_config}"
          export NPM_CONFIG_CACHE="${RUNNER_TEMP}/ssai-connect-npm-cache"
          export NPM_CONFIG_IGNORE_SCRIPTS=true NPM_CONFIG_AUDIT=false NPM_CONFIG_FUND=false NPM_CONFIG_GIT=/usr/bin/git
          npm ci --ignore-scripts --audit=false --fund=false
          unset GIT_CONFIG_GLOBAL GIT_CONFIG_NOSYSTEM GIT_TERMINAL_PROMPT GIT_ASKPASS SSH_ASKPASS
          unset NPM_CONFIG_USERCONFIG NPM_CONFIG_GLOBALCONFIG NPM_CONFIG_CACHE NPM_CONFIG_IGNORE_SCRIPTS NPM_CONFIG_AUDIT NPM_CONFIG_FUND NPM_CONFIG_GIT
          cleanup_configs
          trap - EXIT
          test ! -e "${public_git_config}" && test ! -e "${npm_user_config}" && test ! -e "${npm_global_config}"
          if git config --show-origin --get-regexp 'http\..*extraheader|url\..*@github\.com.*insteadOf' >/dev/null 2>&1; then
            echo '::error::Git authentication residue exists before repository code executes'
            exit 1
          fi

      - name: Validate complete production readiness and exact build identity
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          [[ "${EXPECTED_BUILD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [ "${checkout_sha}" = "${EXPECTED_BUILD_SHA}" ]
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          npm run check
          EXPECTED_BUILD_SHA="${EXPECTED_BUILD_SHA}" node scripts/verify-connect-build-identity-dist.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
